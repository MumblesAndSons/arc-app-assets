name: Refresh feeds

# Runs every 15 minutes. The schedule is announced late: 27 of 138 recorded
# conditions appeared less than two hours before they started, and a few only
# once they were already running. Hourly was leaving the app behind.
#
# Design notes, because this has to survive unattended:
#  * each feed runs in its own step with continue-on-error, so one broken
#    source cannot stop the other
#  * a script that cannot parse its source exits non-zero and writes nothing,
#    which leaves the last good file in place
#  * the commit step only commits when something actually changed
#  * a failure opens ONE GitHub issue and then goes quiet: a reminder a day
#    while it stays broken, and a closing comment when it recovers
#  * the job commits most hours, which also keeps GitHub from auto-disabling
#    the schedule for inactivity
#  * scripts/watch.mjs raises an issue when Embark publish an article, or when
#    a map condition turns up that the app has no artwork for
#  * map conditions MERGE into the file rather than replace it, so a skipped or
#    failed run costs nothing and the thin far end of the schedule fills in.
#    scripts/lib/schedule.mjs explains why, scripts/test-schedule.mjs proves it
#  * the last step checks the RESULT, not the run: it re-reads the site and
#    fails if the published file is missing anything the site is showing

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Raise a test issue, to prove the alert email arrives'
        type: boolean
        default: false

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # Cheap, and the merge rules are the only thing standing between the app
      # and a schedule that is quietly wrong.
      - name: Test
        run: npm test

      - name: Map conditions
        id: conditions
        continue-on-error: true
        run: node scripts/map-conditions.mjs

      # Rewrites every new article before publishing it, so the app never
      # carries copied prose. Without the key the script refreshes the index,
      # publishes no bodies, and fails so the issue below gets raised.
      - name: News
        id: news
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/news.mjs

      # Runs before the commit, so "what is new" is just the difference
      # between the working tree and the last commit.
      - name: Watch for anything that needs a person
        id: watch
        continue-on-error: true
        env:
          TEST_ALERT: ${{ inputs.test_alert }}
        run: node scripts/watch.mjs

      - name: Raise an issue for anything the watcher found
        if: steps.watch.outputs.alerts != '' && steps.watch.outputs.alerts != '[]'
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = JSON.parse(process.env.ALERTS);
            const { owner, repo } = context.repo;

            for (const a of alerts) {
              // One standing issue per kind of problem. A map condition sits
              // in the schedule for hours, so a fresh issue every run would
              // bury the inbox.
              if (a.label === 'new-condition') {
                const open = await github.rest.issues.listForRepo({
                  owner, repo, state: 'open', labels: a.label,
                });
                if (open.data.length) {
                  core.info(`already open: ${open.data[0].html_url}`);
                  continue;
                }
              }

              // An article is a one off. Skip it if it was ever raised before,
              // open or closed, so a reopened feed cannot repeat itself.
              if (a.label === 'new-article') {
                const q = `repo:${owner}/${repo} is:issue in:title "${a.title.replace(/"/g, '')}"`;
                const found = await github.rest.search.issuesAndPullRequests({ q });
                if (found.data.total_count > 0) {
                  core.info(`already raised: ${a.title}`);
                  continue;
                }
              }

              // Assigned on purpose. GitHub always emails an assignee, even
              // if the account is not watching the repository, so the alert
              // does not depend on a notification setting staying put.
              const made = await github.rest.issues.create({
                owner, repo, title: a.title, body: a.body,
                labels: [a.label], assignees: [owner],
              });
              core.info(`raised ${made.data.html_url}`);
            }
        env:
          ALERTS: ${{ steps.watch.outputs.alerts }}

      - name: Commit any changes
        run: |
          git config user.name  "topside-feed-bot"
          git config user.email "actions@github.com"
          git add feeds/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "feeds: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Fail the run if a feed went stale
        id: stale
        run: |
          now=$(date -u +%s)
          for f in feeds/map-conditions.json feeds/news.json; do
            if [ ! -f "$f" ]; then echo "MISSING $f"; exit 1; fi
          done
          gen=$(node -e "console.log(Math.floor(Date.parse(require('./feeds/map-conditions.json').generatedAt)/1000))")
          age=$(( (now - gen) / 3600 ))
          echo "map-conditions is ${age}h old"
          # four runs an hour, so 3h means about a dozen in a row did not land
          if [ "$age" -gt 3 ]; then
            echo "map conditions have not refreshed for ${age} hours"
            exit 1
          fi

      # The one check that asks whether the APP is right, rather than whether
      # the run went well. Deliberately last, so it judges what was committed.
      - name: Check the app has what the site is showing
        id: verify
        run: node scripts/verify-feed.mjs

      # Alerting rule. This used to comment on every run that had any step
      # fail, which sent an email every 15 minutes: 161 of them in 13 days,
      # and 147 of those were the same four-day outage repeating itself.
      # Nobody reads an alert that arrives that often.
      #
      # The rule now is: alert only when the JOB failed, which means the feed
      # went stale or the app stopped matching the site. A single feed step
      # wobbling is NOT an alert, because the app keeps the last good file and
      # the next run 15 minutes later normally fixes it.
      #
      # One email when it breaks. One a day while it stays broken. One when it
      # recovers. An outage costs two emails instead of a few hundred.
      - name: Raise the alert
        if: failure()
        uses: actions/github-script@v7
        env:
          CONDITIONS: ${{ steps.conditions.outcome }}
          NEWS: ${{ steps.news.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          STALE: ${{ steps.stale.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'Feed refresh is failing';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'Something is wrong with the feed and the app is affected.',
              '',
              `Map conditions step: ${process.env.CONDITIONS}`,
              `News step: ${process.env.NEWS}`,
              `Feed freshness check: ${process.env.STALE}`,
              `App matches the site: ${process.env.VERIFY}`,
              '',
              `Run: ${run}`,
              '',
              'How to read this:',
              '',
              '* "App matches the site" = failure means the app is showing fewer map',
              '  conditions than arcraiders.com is. Open the run and read that step,',
              '  it lists exactly what is missing.',
              '* "App matches the site" = skipped means the run stopped before it got',
              '  there, because the map conditions file has not refreshed for over',
              '  three hours. About a dozen runs in a row failed to land.',
              '',
              'You will get no further email about this until it recovers, or until it',
              'is still broken 24 hours from now.',
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'feed-failure',
            });

            if (!open.data.length) {
              const made = await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['feed-failure'], assignees: [owner],
              });
              core.info(`raised ${made.data.html_url}`);
              return;
            }

            // Already reported. Say nothing for a day, so an outage that lasts
            // a weekend does not send 300 emails.
            const issue = open.data[0];
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            const recent = await github.rest.issues.listComments({
              owner, repo, issue_number: issue.number,
              since: new Date(cutoff).toISOString(), per_page: 1,
            });
            if (recent.data.length || Date.parse(issue.created_at) > cutoff) {
              core.info(`${issue.html_url} is already open and was updated within a day; staying quiet`);
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: ['Still failing, 24 hours on.', '', body].join('\n'),
            });
            core.info(`daily reminder added to ${issue.html_url}`);

      # The whole run went green, so anything we raised before is over. Closing
      # it is the recovery email, and it means the next outage opens a fresh
      # issue instead of adding to a thread of hundreds.
      - name: Clear the alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'feed-failure',
            });
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  'Recovered. The feed refreshed and the app matches arcraiders.com again.',
                  '',
                  `Run: ${run}`,
                  '',
                  'Closing this. A new issue opens if it breaks again.',
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`closed ${issue.html_url}`);
            }
