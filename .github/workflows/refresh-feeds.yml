name: Refresh feeds

# Runs every hour. Map conditions only publish about 24 hours ahead, so the
# app needs a fresh file well inside that window.
#
# Design notes, because this has to survive unattended:
#  * each feed runs in its own step with continue-on-error, so one broken
#    source cannot stop the other
#  * a script that cannot parse its source exits non-zero and writes nothing,
#    which leaves the last good file in place
#  * the commit step only commits when something actually changed
#  * a failure opens a GitHub issue, so it is visible without watching runs
#  * the job commits most hours, which also keeps GitHub from auto-disabling
#    the schedule for inactivity

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Map conditions
        id: conditions
        continue-on-error: true
        run: node scripts/map-conditions.mjs

      - name: News
        id: news
        continue-on-error: true
        run: node scripts/news.mjs

      - name: Commit any changes
        run: |
          git config user.name  "topside-feed-bot"
          git config user.email "actions@github.com"
          git add feeds/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "feeds: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Fail the run if a feed went stale
        run: |
          now=$(date -u +%s)
          for f in feeds/map-conditions.json feeds/news.json; do
            if [ ! -f "$f" ]; then echo "MISSING $f"; exit 1; fi
          done
          gen=$(node -e "console.log(Math.floor(Date.parse(require('./feeds/map-conditions.json').generatedAt)/1000))")
          age=$(( (now - gen) / 3600 ))
          echo "map-conditions is ${age}h old"
          # the schedule reaches ~24h ahead, so 6h of failures is the alarm point
          if [ "$age" -gt 6 ]; then
            echo "map conditions have not refreshed for ${age} hours"
            exit 1
          fi

      - name: Report a broken feed
        if: failure() || steps.conditions.outcome == 'failure' || steps.news.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const conditions = ${{ toJSON(steps.conditions.outcome) }};
            const news = ${{ toJSON(steps.news.outcome) }};
            const body = [
              'The hourly feed refresh failed.',
              '',
              'Map conditions step: ' + conditions,
              'News step: ' + news,
              '',
              context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                '/actions/runs/' + context.runId,
              '',
              'The app keeps showing the last good file until this is fixed.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'feed-failure',
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Feed refresh is failing', body, labels: ['feed-failure'],
              });
            }
